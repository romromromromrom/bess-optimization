[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bess-optimization"
version = "0.1.0"
description = "Research toolkit for BESS merchant revenue, dispatch and futures hedging"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BESS Optimization contributors" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "pyomo>=6.8,<7",
  "highspy>=1.7,<2",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
  "plotly>=5.23,<7",
  "streamlit>=1.37,<2",
  "typer>=0.12,<1",
  "entsoe-py>=0.6,<1",
  "pyarrow>=17,<22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
]

[project.scripts]
bess-opt = "bess_optimization.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bess_optimization"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
